<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#001539" />
    <title>Offline · HealthWallet | LUX AI</title>
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #f6f8fc;
        color: #001539;
        font:
          1rem/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 30rem;
        margin: 1.5rem;
        padding: 2rem;
        background: white;
        border-top: 5px solid #ff7900;
        border-radius: 1rem;
      }
      img {
        width: 180px;
        max-width: 100%;
        height: auto;
      }
      h1 {
        line-height: 1.2;
      }
      a {
        display: inline-block;
        background: #ff7900;
        color: #001539;
        font-weight: 700;
        padding: 0.8rem 1.4rem;
        border-radius: 0.7rem;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #001539;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/lux-ai-logo.png" alt="LUX AI" width="2172" height="724" />
      <p>HealthWallet Liberia</p>
      <h1>Let’s reconnect.</h1>
      <p>
        You’re offline. Connect to the internet to sign in and continue your care journey. Account
        information is not stored for offline access.
      </p>
      <a href="/">Try again</a>
      <p>Powered by LUX HealthTrust</p>
    </main>
  </body>
</html>
