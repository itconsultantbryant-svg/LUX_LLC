services:
  postgres:
    image: postgres:16-alpine
    container_name: healthwallet-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: healthwallet
      POSTGRES_PASSWORD: healthwallet
      POSTGRES_DB: healthwallet_dev
    volumes:
      - healthwallet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U healthwallet -d healthwallet_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  healthwallet_pgdata:
