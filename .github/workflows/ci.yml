name: Verify rebuilt LUX HealthPay
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lux
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: lux
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lux"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lux:ci-ephemeral-only@localhost:5432/lux
      TEST_DATABASE_URL: postgresql://lux:ci-ephemeral-only@localhost:5432/lux_tests
      LUX_MODE: demo
      ALLOW_DEMO_SEED: "true"
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate local-only secrets and isolated test database
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DEMO_PASSWORD=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
          PGPASSWORD=ci-ephemeral-only createdb -h localhost -U lux lux_tests
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and exercise browser journeys
        run: |
          node --import tsx apps/api/src/main.ts > api.log 2>&1 &
          node --import tsx apps/worker/src/main.ts > worker.log 2>&1 &
          pnpm build
          pnpm --filter @lux/web start > web.log 2>&1 &
          for i in $(seq 1 40); do if curl -sf http://localhost:3000/login > /dev/null; then break; fi; sleep 2; done
          pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-test-traces
          path: test-results/
          retention-days: 7
